  - generic [ref=e511]:
    - region [ref=e512]:
      - generic [ref=e513]: CÁCH DÙNG
      - heading "Ba bước trước khi bấm Đăng quảng cáo" [level=2] [ref=e514]
      - paragraph [ref=e515]: Soát một lượt ở đây rẻ hơn nhiều so với để quảng cáo chạy rồi mới thấy giá bị nút CTA che mất.
      - generic [ref=e516]:
        - article [ref=e517]:
          - generic [ref=e518]: "1"
          - heading "Chọn ảnh hoặc video" [level=3] [ref=e522]
          - paragraph [ref=e523]: Kéo thả tệp quảng cáo vào ô bên trái. Chọn nhiều tệp là thành băng chuyền. Thêm logo nếu muốn ảnh đại diện giống thật.
        - article [ref=e524]:
          - generic [ref=e525]: "2"
          - heading "Nhập chữ quảng cáo" [level=3] [ref=e529]
          - paragraph [ref=e530]: Văn bản chính, tiêu đề, mô tả và nút CTA dùng chung cho mọi nền tảng. Google, YouTube và ChatGPT có ô riêng nếu cần chữ khác.
        - article [ref=e531]:
          - generic [ref=e532]: "3"
          - heading "Soát từng vị trí" [level=3] [ref=e540]
          - paragraph [ref=e541]: Bấm qua các nền tảng và vị trí. Bật Vùng bị che để thấy phần video bị giao diện đè lên, đọc danh sách lỗi và sửa ngay bên trái.
    - region [ref=e542]:
      - generic [ref=e543]: TÍNH NĂNG
      - heading "Thấy đúng thứ người xem sẽ thấy" [level=2] [ref=e544]
      - paragraph [ref=e545]: Mỗi vị trí đọc giới hạn ký tự, tỉ lệ khung và vùng an toàn từ hướng dẫn của chính nền tảng đó.
      - generic [ref=e546]:
        - article [ref=e547]:
          - heading "Vùng an toàn có số đo" [level=3] [ref=e552]
          - paragraph [ref=e553]: Vùng bị che vẽ theo hướng dẫn của Meta, TikTok và YouTube, tô đỏ phần luôn bị che và tô cam phần bị che thêm khi chú thích dài.
        - article [ref=e554]:
          - heading "Đánh dấu vùng video bị che" [level=3] [ref=e563]
          - paragraph [ref=e564]: Tô vùng giao diện che trên từng vị trí để bạn tự kiểm tra chữ, logo và sản phẩm trước khi chạy quảng cáo.
        - article [ref=e565]:
          - heading "Đủ vị trí hiển thị" [level=3] [ref=e571]
