  - generic [ref=e487]:
    - region [ref=e488]:
      - generic [ref=e489]: TÍNH NĂNG
      - heading "Thấy đúng thứ người xem sẽ thấy" [level=2] [ref=e490]
      - paragraph [ref=e491]: Mỗi vị trí đọc giới hạn ký tự, tỉ lệ khung và vùng an toàn từ hướng dẫn của chính nền tảng đó.
      - generic [ref=e492]:
        - article [ref=e493]:
          - heading "Vùng an toàn có số đo" [level=3] [ref=e498]
          - paragraph [ref=e499]: Vùng bị che vẽ theo hướng dẫn của Meta, TikTok và YouTube, tô đỏ phần luôn bị che và tô cam phần bị che thêm khi chú thích dài.
        - article [ref=e500]:
          - heading "Đánh dấu vùng video bị che" [level=3] [ref=e509]
          - paragraph [ref=e510]: Tô vùng giao diện che trên từng vị trí để bạn tự kiểm tra chữ, logo và sản phẩm trước khi chạy quảng cáo.
        - article [ref=e511]:
          - heading "Đủ vị trí hiển thị" [level=3] [ref=e517]
          - paragraph [ref=e518]: Bảng feed, Stories, Reels, Marketplace, kết quả tìm kiếm, cột bên phải, video trong luồng, Audience Network, Shorts, In-Feed, TopView, Google Search và Display.
        - article [ref=e519]:
          - heading "Đếm ký tự đúng cách nền tảng đếm" [level=3] [ref=e524]
          - paragraph [ref=e525]: Chữ Việt có dấu và emoji được đếm là một ký tự như người đọc thấy; Google đếm chữ Hàn, Nhật, Trung là hai, đúng quy định.
        - article [ref=e526]:
          - heading "Xem tất cả vị trí một lần" [level=3] [ref=e530]
          - paragraph [ref=e531]: Chế độ lưới đặt mọi vị trí của một nền tảng cạnh nhau, kèm số lỗi từng vị trí, để chọn bộ tài nguyên dùng được cho nhiều chỗ nhất.
        - article [ref=e532]:
          - heading "Không gửi gì đi đâu" [level=3] [ref=e538]
          - paragraph [ref=e539]: Ảnh và video chỉ nằm trong trình duyệt. Không tải tệp lên, không lưu lại gì khi đóng hoặc tải lại trang.
