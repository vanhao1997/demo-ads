    function isCjkCodePoint(cp) {
      return (
        (cp >= 4352 && cp <= 4447) ||
        (cp >= 11904 && cp <= 42191) ||
        (cp >= 44032 && cp <= 55203) ||
        (cp >= 63744 && cp <= 64255) ||
        (cp >= 65072 && cp <= 65103) ||
        (cp >= 65280 && cp <= 65374)
      );
    }

    function countGoogleCharacters(str) {
      if (!str) return 0;
      let count = 0;
      for (const ch of str) {
        count += isCjkCodePoint(ch.codePointAt(0)) ? 2 : 1;
      }
      return count;
    }

    function trimToLimit(str, maxLimit, weighted = false) {
      if (!str) return "";
      if (!weighted) return str.slice(0, maxLimit).trimEnd();
      let count = 0;
      let out = "";
      for (const ch of str) {
        const w = isCjkCodePoint(ch.codePointAt(0)) ? 2 : 1;
        if (count + w > maxLimit) break;
        out += ch;
        count += w;
      }
      return out.trimEnd();
    }

      if (!text) return [];

      return tokens.filter((w) => !ALLOWED_UPPERCASE_TOKENS.has(w) && !/^[A-Z]+\d+$/.test(w));

    function normalizeCapsInText(text) {
      if (!text) return "";

        if (ALLOWED_UPPERCASE_TOKENS.has(word) || /^[A-Z]+\d+$/.test(word)) return word;
        return word.charAt(0) + word.slice(1).toLowerCase();

    function sanitizePolicyText(str, platformId) {
      if (!str) return "";
      let s = str;
      // 1. Fix dotted/spaced text evasion (e.g., g.i.ả.m -> giảm)
      s = s.replace(/\b([a-zA-ZÀ-ỹ])\.([a-zA-ZÀ-ỹ])\.([a-zA-ZÀ-ỹ])(?:\.([a-zA-ZÀ-ỹ]))?(?:\.([a-zA-ZÀ-ỹ]))?/gu, "$1$2$3$4$5");
      // 2. Fix repeated punctuation (!!!, ???, ...., ***, $$$)
      s = s.replace(/!{2,}/g, "!").replace(/\?{2,}/g, "?").replace(/\.{4,}/g, "...").replace(/[*$]{2,}/g, "");
      // 3. Replace absolute 100% / medical / get-rich guarantees
      s = s
        .replace(/cam kết 100%|đảm bảo 100%|chắc chắn 100%|hiệu quả 100%/gi, "tối ưu hiệu suất")
        .replace(/trị dứt điểm|chữa khỏi hoàn toàn|khỏi bệnh 100%/gi, "hỗ trợ cải thiện")
        .replace(/làm giàu nhanh|kiếm tiền dễ dàng|không rủi ro 100%/gi, "tăng trưởng bền vững");
      // 4. Meta Personal Attributes & Engagement Bait

          .replace(/bạn đang thừa cân|bạn đang béo|bạn bị mụn|bạn bị nám|bạn bị rụng tóc|bạn đang mất ngủ|bạn đang nợ nần|bạn đang thiếu tiền|bạn đang bế tắc/gi, "doanh nghiệp cần tối ưu vận hành")

      }

        s = s
          .replace(/(?:\+84|0)(?:3|5|7|8|9)\d{8}\b|\b1[89]00[\s.-]?\d{4,6}\b/g, "")
          .replace(/nhấp vào đây|click vào đây|bấm vào đây|click here/gi, "tìm hiểu ngay")
          .replace(/https?:\/\/\S+|zalo\.me\/\S*|liên hệ zalo|inbox zalo/gi, "");

      }
      // 7. Zalo & Admicro Vietnam Advertising Law Article 8 superlatives & press sensationalism
      if (["zalo", "admicro"].includes(platformId)) {
        s = s
          .replace(/\b(số 1|số một|tốt nhất|duy nhất|nhất việt nam|rẻ nhất thị trường|đầu tiên và duy nhất)\b/gi, "chuyên nghiệp")
          .replace(/cực sốc|chấn động|kinh hoàng|lộ diện bí mật|rúng động/gi, "nổi bật");
      }
      // 8. LinkedIn B2B professional filter
      if (platformId === "linkedin") {
        s = s.replace(/xả kho|thanh lý giá rẻ|mua 1 tặng 10|cực sốc/gi, "giải pháp doanh nghiệp");

      // 9. ChatGPT neutral citation style (no '!' or urgent sales pressure)

      }
      // 10. Normalize excessive ALL CAPS
      if (findExcessiveCapsWords(s).length >= 1) {

      return s.replace(/\s+/g, " ").trim();

        if (d2.toLowerCase() === next.primaryText.toLowerCase()) d2 = DEFAULT_STATE.description2;
        next.description2 = d2;
        next.description3 = trimToLimit(sanitizePolicyText(stripEmojis(next.description3 || DEFAULT_STATE.description3), platformId).replace(/!+/g, ""), 90, true);
        next.description4 = trimToLimit(sanitizePolicyText(stripEmojis(next.description4 || DEFAULT_STATE.description4), platformId).replace(/!+/g, ""), 90, true);
        next.path1 = trimToLimit((next.path1 || "giai-phap").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "-").replace(/[^a-zA-Z0-9-_]/g, ""), 15, true) || "giai-phap";
        next.path2 = trimToLimit((next.path2 || "ai-marketing").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "-").replace(/[^a-zA-Z0-9-_]/g, ""), 15, true) || "ai-marketing";
        next.sitelink1 = trimToLimit(stripEmojis(next.sitelink1 || "Sản phẩm"), 25, true);
        next.sitelink2 = trimToLimit(stripEmojis(next.sitelink2 || "Bài viết"), 25, true);
        next.sitelink3 = trimToLimit(stripEmojis(next.sitelink3 || "Tiện ích"), 25, true);
        next.sitelink4 = trimToLimit(stripEmojis(next.sitelink4 || "Knowledge"), 25, true);
      }
      if (platformId === "gdn") {
        next.gdnLongHeadline = trimToLimit(sanitizePolicyText(stripEmojis(next.gdnLongHeadline || DEFAULT_STATE.gdnLongHeadline), platformId).replace(/!+/g, ""), 90, true) || DEFAULT_STATE.gdnLongHeadline;
      }
      if (platformId === "youtube") {
        next.ytHeadline = trimToLimit(sanitizePolicyText(next.ytHeadline || DEFAULT_STATE.ytHeadline, platformId).replace(/không thể bỏ qua|cảnh báo khẩn cấp|bấm vào trước khi bị xóa/gi, ""), 90, false) || DEFAULT_STATE.ytHeadline;
        next.ytCta = trimToLimit(sanitizePolicyText(stripEmojis(next.ytCta || "Đăng ký"), platformId).replace(/!+/g, ""), 10, true) || "Đăng ký";
      }
      if (platformId === "tiktok") {
        next.pollQuestion = trimToLimit(sanitizePolicyText(next.pollQuestion || DEFAULT_STATE.pollQuestion, platformId), 65, false);
        next.pollOptionA = trimToLimit(sanitizePolicyText(next.pollOptionA || DEFAULT_STATE.pollOptionA, platformId), 16, false);
        next.pollOptionB = trimToLimit(sanitizePolicyText(next.pollOptionB || DEFAULT_STATE.pollOptionB, platformId), 16, false);
        next.promoCode = (next.promoCode || "P2P2026").replace(/[^a-zA-Z0-9]/g, "").toUpperCase().slice(0, 12) || "P2P2026";
      }
      if (platformId === "admicro") {
        next.admicroSponsor = (next.admicroSponsor || "").trim() || (next.brandName || "P2P Digital");
        if (next.admicroSapo) {
          next.admicroSapo = trimToLimit(sanitizePolicyText(next.admicroSapo, platformId), 140, false);
        }
      }
      if (platformId === "chatgpt") {
        if (next.chatgptTitle) {
          next.chatgptTitle = trimToLimit(sanitizePolicyText(next.chatgptTitle, platformId).replace(/!+/g, ""), 60, false);
        }
        if (next.chatgptBody) {
          next.chatgptBody = trimToLimit(sanitizePolicyText(next.chatgptBody, platformId).replace(/!+/g, "."), 160, false);
        }
      }

      // 6. Ensure CTA is officially supported on the active channel
      if (g.supportedCtas && !g.supportedCtas.includes(next.cta)) {
        next.cta = g.defaultCta;
      }

      return next;
    }

    function evaluateValidation(placement, state) {
      const errors = [];
      const warnings = [];
      const notes = [];

      const pf = placement.platform;
      const g = PLATFORM_GUIDELINES[pf] || PLATFORM_GUIDELINES.facebook;
      const primaryLen = (state.primaryText || "").length;
      const headlineLen = (state.headline || "").length;
      const descLen = (state.description || "").length;
      const brandLen = (state.brandName || "").length;

      const combinedCopy = [
        state.brandName,
        state.primaryText,
        state.headline,
        state.description,
        pf === "google_search" ? `${state.headline2 || ""} ${state.headline3 || ""} ${state.description2 || ""}` : "",
        pf === "gdn" ? (state.gdnLongHeadline || "") : "",
        pf === "youtube" ? `${state.ytHeadline || ""} ${state.ytCta || ""}` : "",
        pf === "admicro" ? (state.admicroSapo || "") : "",
        pf === "chatgpt" ? `${state.chatgptTitle || ""} ${state.chatgptBody || ""}` : ""
      ].join(" ");

      // ======================================================================
      // A. CROSS-PLATFORM ANTI-PENALTY & MODERATION RULES (ALL 11 CHANNELS)
      // ======================================================================
      const rawUrl = (state.url || "").trim();
      if (!rawUrl) {
        errors.push("Thiếu URL trang đích (Destination URL) — Quảng cáo bắt buộc phải có trang đích hoạt động.");
      } else if (!rawUrl.startsWith("https://")) {
        errors.push("Vi phạm bảo mật Trang đích: URL bắt buộc sử dụng giao thức https:// để tránh bị từ chối xét duyệt.");
      } else if (/\s/.test(rawUrl) || /example\.com|localhost|test\.com/i.test(rawUrl)) {
        errors.push("URL trang đích không hợp lệ hoặc dùng tên miền giữ chỗ (yêu cầu tên miền thực tế hoạt động).");
      }

      if (/\b[a-zA-ZÀ-ỹ]\.[a-zA-ZÀ-ỹ]\.[a-zA-ZÀ-ỹ]/u.test(combinedCopy)) {
        errors.push("Vi phạm chính sách Né tránh hệ thống (Circumventing Systems): Không dùng dấu chấm ngắt từng ký tự (ví dụ: g.i.ả.m g.i.á) để lách bộ lọc.");
      }

      if (/[!]{2,}|[?]{2,}|[.]{4,}|[*$]{2,}/.test(combinedCopy)) {
        errors.push("Vi phạm chuẩn biên tập quảng cáo: Không lặp lại dấu câu hoặc ký tự đặc biệt quá mức (!!, ??, ...., **, $$).");
      }

      const capsViolations = Array.from(new Set(findExcessiveCapsWords(combinedCopy)));
      if (capsViolations.length >= 2) {
        errors.push(`Vi phạm chính sách lạm dụng chữ IN HOA: Không viết hoa toàn bộ từ thông thường (${capsViolations.slice(0, 3).join(", ")}); chỉ viết hoa từ viết tắt chuẩn (AI, CRM, B2B, P2P).`);
      }

      if (/(cam kết 100%|đảm bảo 100%|chắc chắn 100%|hiệu quả 100%|trị dứt điểm|chữa khỏi hoàn toàn|khỏi bệnh 100%|làm giàu nhanh|kiếm tiền dễ dàng|không rủi ro 100%)/i.test(combinedCopy)) {
        errors.push("Vi phạm chính sách Nội dung gây hiểu lầm: Cấm dùng từ ngữ cam kết tuyệt đối 100%, trị dứt điểm hoặc làm giàu nhanh (nguy cơ cao bị khóa tài khoản).");
      }

      // ======================================================================
      // B. PLATFORM-SPECIFIC ANTI-PENALTY & TECHNICAL RULES
      // ======================================================================

      // 1. META (FACEBOOK, INSTAGRAM, THREADS) ANTI-PENALTY RULES
      if (["facebook", "instagram", "threads"].includes(pf)) {
        if (/(bạn đang thừa cân|bạn đang béo|bạn bị mụn|bạn bị nám|bạn bị rụng tóc|bạn đang mất ngủ|bạn đang nợ nần|bạn đang thiếu tiền|bạn đang bế tắc)/i.test(combinedCopy)) {
          errors.push("Vi phạm Chính sách Meta (Personal Attributes): Không ám chỉ trực tiếp đặc điểm cá nhân, sức khỏe hoặc tài chính của người xem (\"bạn đang nợ nần\", \"bạn đang mất ngủ\"...).");
        }
        if (/(like và share|nhấn like và chia sẻ|tag 3 người bạn|tag bạn bè vào|comment chấm|chấm \(\.\) để)/i.test(combinedCopy)) {
          errors.push("Vi phạm Chính sách Meta (Engagement Bait): Không dùng câu chữ câu kéo tương tác giả tạo (\"like và share\", \"tag 3 người bạn\").");
        }
      }

      // 2. GOOGLE SEARCH (SEM / RSA) OFFICIAL POLICY & LIMITS
      if (pf === "google_search") {
        const bW = countGoogleCharacters(state.brandName);
        const h1W = countGoogleCharacters(state.headline);
        const h2W = countGoogleCharacters(state.headline2);
        const h3W = countGoogleCharacters(state.headline3);
        const d1W = countGoogleCharacters(state.primaryText);
        const d2W = countGoogleCharacters(state.description2);
        const d3W = countGoogleCharacters(state.description3);
        const d4W = countGoogleCharacters(state.description4);
        const p1W = countGoogleCharacters(state.path1);
        const p2W = countGoogleCharacters(state.path2);
        const calloutW = countGoogleCharacters(state.description);

        if (bW > 25) errors.push(`Tên doanh nghiệp Google Search tối đa 25 ký tự (hiện có ${bW}/25).`);
        if (h1W === 0 || h2W === 0 || h3W === 0) errors.push("Google RSA bắt buộc nhập đủ tối thiểu 3 Tiêu đề (Headline 1, 2, 3).");
        if (h1W > 30) errors.push(`Tiêu đề 1 (RSA) vượt quá giới hạn 30 ký tự (hiện có ${h1W}/30).`);
        if (h2W > 30) errors.push(`Tiêu đề 2 (RSA) vượt quá giới hạn 30 ký tự (hiện có ${h2W}/30).`);
        if (h3W > 30) errors.push(`Tiêu đề 3 (RSA) vượt quá giới hạn 30 ký tự (hiện có ${h3W}/30).`);
        if ([state.headline, state.headline2, state.headline3].some((h) => (h || "").includes("!"))) {
          errors.push("Vi phạm chính sách Google Ads: Tiêu đề quảng cáo Tìm kiếm (Headline) tuyệt đối không được chứa dấu chấm than (!).");
        }
        if ([state.headline, state.headline2, state.headline3, state.primaryText, state.description2].some((t) => emojiRegex.test(t || ""))) {
          errors.push("Vi phạm chính sách Google Ads: Không sử dụng ký tự Emoji trong Tiêu đề hoặc Mô tả RSA.");
        }
        // Duplicate RSA Headlines check
        const hNorms = [state.headline, state.headline2, state.headline3]
          .map((h) => (h || "").trim().toLowerCase())
          .filter(Boolean);
        if (new Set(hNorms).size < hNorms.length) {
          errors.push("Vi phạm chính sách Google RSA: Các Tiêu đề (Headline 1, 2, 3) không được trùng lặp nội dung với nhau.");
        }
        // Phone number in RSA text check
        if (/(?:\+84|0)(?:3|5|7|8|9)\d{8}\b|\b1[89]00[\s.-]?\d{4,6}\b/.test(`${state.headline} ${state.headline2} ${state.headline3} ${state.primaryText} ${state.description2}`)) {
          errors.push("Vi phạm chính sách Google Ads (Phone Number in Ad Text): Không viết trực tiếp số điện thoại trong Tiêu đề/Mô tả (bắt buộc dùng Tiện ích cuộc gọi / Call Asset).");
        }
        // Generic clickbait phrase check
        if (/(nhấp vào đây|click vào đây|bấm vào đây|click here)/i.test(combinedCopy)) {
          errors.push("Vi phạm chính sách Google Ads (Clickbait): Không dùng cụm từ chung chung \"Nhấp vào đây / Click vào đây\" trong quảng cáo.");
        }
        if (d1W === 0 || d2W === 0) errors.push("Google RSA bắt buộc nhập tối thiểu 2 Mô tả (Description 1 & 2).");
        if (d1W > 90) errors.push(`Mô tả 1 (RSA) vượt quá giới hạn 90 ký tự (hiện có ${d1W}/90).`);
        if (d2W > 90) errors.push(`Mô tả 2 (RSA) vượt quá giới hạn 90 ký tự (hiện có ${d2W}/90).`);
        if (d3W > 90) errors.push(`Mô tả 3 (RSA) vượt quá giới hạn 90 ký tự (hiện có ${d3W}/90).`);
        if (d4W > 90) errors.push(`Mô tả 4 (RSA) vượt quá giới hạn 90 ký tự (hiện có ${d4W}/90).`);
        if (p1W > 15 || p2W > 15) errors.push(`Đường dẫn hiển thị (/path1, /path2) tối đa 15 ký tự mỗi phần (hiện có ${p1W}/15 và ${p2W}/15).`);
        if (/[^a-zA-Z0-9-_]/.test(state.path1 || "") || /[^a-zA-Z0-9-_]/.test(state.path2 || "")) {
          errors.push("Đường dẫn hiển thị (/path1, /path2) chứa ký tự không hợp lệ (chỉ dùng chữ cái không dấu, số và dấu gạch ngang).");
        }
        if (calloutW > 25) warnings.push(`Chú thích mở rộng (Callout) khuyên dùng ≤ 25 ký tự (hiện có ${calloutW}/25).`);
        const slMax = Math.max(
          countGoogleCharacters(state.sitelink1),
          countGoogleCharacters(state.sitelink2),
          countGoogleCharacters(state.sitelink3),
          countGoogleCharacters(state.sitelink4)
        );
        if (slMax > 25) errors.push(`Liên kết phụ (Sitelink Asset) tối đa 25 ký tự mỗi liên kết (hiện có ${slMax}/25).`);
      }

      // 3. GOOGLE DISPLAY NETWORK (GDN / RDA / DEMAND GEN) OFFICIAL POLICY & LIMITS
      if (pf === "gdn") {
        const bW = countGoogleCharacters(state.brandName);
        const hW = countGoogleCharacters(state.headline);
        const longHW = countGoogleCharacters(state.gdnLongHeadline);
        const pW = countGoogleCharacters(state.primaryText);
        const dW = countGoogleCharacters(state.description);

        if (bW > 25) errors.push(`Tên doanh nghiệp GDN tối đa 25 ký tự (hiện có ${bW}/25).`);
        if (hW > 30) errors.push(`Tiêu đề ngắn GDN (Short Headline) tối đa 30 ký tự (hiện có ${hW}/30).`);
        if (longHW > 90) errors.push(`Tiêu đề dài GDN (Long Headline) tối đa 90 ký tự (hiện có ${longHW}/90).`);
        if (pW > 90) errors.push(`Mô tả 1 GDN (RDA Description) tối đa 90 ký tự (hiện có ${pW}/90).`);
        if (dW > 90) warnings.push(`Mô tả 2 GDN khuyên dùng ≤ 90 ký tự (hiện có ${dW}/90).`);
        if ((state.headline || "").includes("!") || (state.gdnLongHeadline || "").includes("!")) {
          errors.push("Vi phạm chính sách Google Display: Tiêu đề quảng cáo không được chứa dấu chấm than (!).");
        }
        if (/(?:\+84|0)(?:3|5|7|8|9)\d{8}\b|\b1[89]00[\s.-]?\d{4,6}\b/.test(combinedCopy)) {
          errors.push("Vi phạm chính sách Google Display: Không chèn trực tiếp số điện thoại vào văn bản quảng cáo RDA.");
        }
        if (/(nhấp vào đây|click vào đây|bấm vào đây|click here)/i.test(combinedCopy)) {
          errors.push("Vi phạm chính sách Google Display: Không dùng cụm từ câu nhấp chuột \"Nhấp vào đây / Click vào đây\".");
        }
      }

      // 4. TIKTOK OFFICIAL POLICY & LIMITS
      if (pf === "tiktok") {
        const maxBrand = state.tiktokIdentity === "spark" ? 30 : 20;
        if (brandLen > maxBrand) {
          errors.push(`Tên hiển thị TikTok (${state.tiktokIdentity === "spark" ? "Spark Ads" : "Non-Spark"}) tối đa ${maxBrand} ký tự (hiện có ${brandLen}/${maxBrand}).`);
        }
        if (emojiRegex.test(state.brandName || "")) {
          errors.push("Vi phạm chính sách TikTok: Tên hiển thị thương hiệu không được chứa biểu tượng cảm xúc (Emoji).");
        }
        if (primaryLen > 100) {
          errors.push(`Văn bản quảng cáo TikTok tối đa 100 ký tự theo quy định (hiện có ${primaryLen}/100).`);
        } else if (primaryLen > 0 && primaryLen < 12) {
          warnings.push(`Văn bản quảng cáo TikTok khuyên dùng từ 12–100 ký tự (hiện có ${primaryLen} ký tự).`);
        }
        if (/(?:\+84|0)(?:3|5|7|8|9)\d{8}\b|zalo\.me|https?:\/\/|liên hệ zalo|inbox zalo/i.test(state.primaryText || "")) {
          errors.push("Vi phạm chính sách TikTok Ads: Không chèn số điện thoại, đường dẫn website hoặc điều hướng Zalo trực tiếp trong Caption (chỉ điều hướng qua nút CTA).");
        }
        if (/(giảm \d+\s*kg|trắng bật tông ngay|trước và sau khi dùng|hiệu quả tức thì sau 1 đêm)/i.test(combinedCopy)) {
          errors.push("Vi phạm chính sách TikTok Ads: Cấm tuyên bố phóng đại công dụng tức thì hoặc so sánh ngoại hình Trước/Sau (\"giảm 5kg\", \"trắng bật tông ngay\").");
        }
        if (state.tiktokAddon === "voting_sticker" || state.adFormat === "poll_interactive") {
          if ((state.pollQuestion || "").length > 65) {
            errors.push(`Câu hỏi Nhãn bình chọn TikTok tối đa 65 ký tự (hiện có ${(state.pollQuestion || "").length}/65).`);
          }
          if ((state.pollOptionA || "").length > 16 || (state.pollOptionB || "").length > 16) {
            errors.push("Lựa chọn A/B trên Nhãn bình chọn TikTok tối đa 16 ký tự mỗi lựa chọn.");
          }
        }
        if (state.tiktokAddon === "gift_code" && ((state.promoCode || "").length > 12 || /[^a-zA-Z0-9]/.test(state.promoCode || ""))) {
          errors.push("Mã quà tặng TikTok (Gift Code) chỉ chấp nhận chữ cái và số, tối đa 12 ký tự.");
        }
      }

      // 5. THREADS OFFICIAL POLICY & LIMITS
      if (pf === "threads") {
        if (primaryLen > 500) {
          errors.push(`Văn bản bài đăng Threads vượt quá giới hạn cứng 500 ký tự (hiện có ${primaryLen}/500).`);
        }
        const hashtags = (state.primaryText || "").match(/#\S+/g) || [];
        if (hashtags.length > 1) {
          errors.push(`Vi phạm quy chuẩn Threads: Chỉ hỗ trợ gắn 1 thẻ chủ đề (#) duy nhất mỗi bài đăng (hiện có ${hashtags.length} thẻ).`);
        }
        if (headlineLen > 40) {
          warnings.push(`Tiêu đề thẻ liên kết Threads nên tối đa 40 ký tự (hiện có ${headlineLen}/40).`);
        }
      }

      // 6. INSTAGRAM OFFICIAL POLICY & LIMITS
      if (pf === "instagram") {
        if (primaryLen > 2200) {
          errors.push(`Chú thích Instagram vượt quá giới hạn 2.200 ký tự (hiện có ${primaryLen}/2200).`);
        }
        const igHashtags = (state.primaryText || "").match(/#\S+/g) || [];
        if (igHashtags.length > 30) {
          errors.push(`Chính sách Instagram tối đa 30 thẻ #hashtag mỗi bài (hiện có ${igHashtags.length}/30).`);
        } else if (igHashtags.length > 5) {
          warnings.push(`Instagram khuyến nghị dùng 3–5 thẻ #hashtag để tối ưu phân phối (hiện có ${igHashtags.length} thẻ).`);
        }
      }

      // 7. YOUTUBE OFFICIAL POLICY & LIMITS
      if (pf === "youtube") {
        const ytCtaLen = countGoogleCharacters(state.ytCta || state.cta);
        const ytLongLen = countGoogleCharacters(state.ytHeadline || state.headline);
        if (ytCtaLen > 10) {
          errors.push(`Nút kêu gọi hành động (CTA) trên YouTube tối đa 10 ký tự (hiện có ${ytCtaLen}/10).`);
        }
        if (ytLongLen > 90) {
          errors.push(`Tiêu đề dài YouTube tối đa 90 ký tự (hiện có ${ytLongLen}/90).`);
        }
        if (headlineLen > 30) {
          warnings.push(`Tiêu đề ngắn YouTube In-Stream / Shorts nên ≤ 30 ký tự (hiện có ${headlineLen}/30).`);
        }
        if (/(không thể bỏ qua|cảnh báo khẩn cấp|bấm vào trước khi bị xóa)/i.test(combinedCopy)) {
          errors.push("Vi phạm chính sách YouTube Ads: Không dùng ngôn từ giả mạo cảnh báo hệ thống hoặc gây hiểu lầm về nút Bỏ qua quảng cáo.");
        }
      }

      // 8. ZALO ADS OFFICIAL POLICY & LIMITS (LUẬT QUẢNG CÁO VIỆT NAM ĐIỀU 8)
      if (pf === "zalo") {
        if (brandLen > 40) errors.push(`Tên Zalo OA / Thương hiệu tối đa 40 ký tự (hiện có ${brandLen}/40).`);
        if (headlineLen > 50) errors.push(`Tiêu đề Zalo Ads vượt quá giới hạn 50 ký tự (hiện có ${headlineLen}/50).`);
        if (primaryLen > 150) warnings.push(`Chú thích Zalo Ads vượt mức hiển thị 150 ký tự (hiện có ${primaryLen}/150).`);
        if (descLen > 60) errors.push(`Mô tả phụ Zalo Ads tối đa 60 ký tự (hiện có ${descLen}/60).`);
        if (/\b(số 1|số một|tốt nhất|duy nhất|nhất việt nam|rẻ nhất thị trường|đầu tiên và duy nhất)\b/i.test(combinedCopy)) {
          errors.push("Vi phạm Chính sách Zalo Ads & Luật Quảng cáo VN (Điều 8): Không dùng từ ngữ so sánh nhất (\"số 1\", \"tốt nhất\", \"duy nhất\", \"rẻ nhất\") khi chưa có giấy tờ chứng minh hợp pháp.");
        }

    function AutoScaler({ width, height, maxHeight = 825, maxScale = 0.945, className = "", children }) {
      const containerRef = useRef(null);
      const [scale, setScale] = useState(0.75);

      useEffect(() => {
        const el = containerRef.current;
        if (!el) return;
        const updateScale = () => {
          const availW = el.clientWidth || width;
          const scaleW = availW / width;
          const scaleH = maxHeight / height;
          const calcScale = Math.min(scaleW, scaleH, maxScale);
          setScale(Math.max(0.15, Number(calcScale.toFixed(4))));
        };
        updateScale();
        const ro = new ResizeObserver(updateScale);
        ro.observe(el);
        window.addEventListener("resize", updateScale);
        return () => {
          ro.disconnect();
          window.removeEventListener("resize", updateScale);
        };
      }, [width, height, maxHeight, maxScale]);

      const scaledW = Math.round(width * scale);
      const scaledH = Math.round(height * scale);

      return (
        <div ref={containerRef} className={`flex w-full justify-center overflow-visible ${className}`}>
          <div style={{ width: scaledW, height: scaledH, position: "relative" }}>
            <div
              style={{
                width,
                height,
                transform: `scale(${scale})`,
                transformOrigin: "top left",
                position: "absolute",
                top: 0,
                left: 0
              }}
            >
              {children}
            </div>
          </div>
        </div>
      );
    }

      const effectiveRatio = state.aspectRatio === "auto" ? ratio : state.aspectRatio;
      const boxStyle = { aspectRatio: RATIO_CSS[effectiveRatio] || "4 / 5", ...style };

      const isCarousel = (state.composition === "carousel" || (state.assets && state.assets.length > 1)) && state.assets && state.assets.length > 1;

      if (isCarousel) {
        const asset = state.assets[currentIdx] || state.assets[0];
        return (
          <div className={`ad-media relative w-full overflow-hidden bg-black select-none ${className}`} style={boxStyle}>
            {asset.type === "video" ? (

            )}

            {/* Carousel Prev/Next Buttons */}
            <button
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                setCurrentIdx((prev) => (prev > 0 ? prev - 1 : state.assets.length - 1));

              className="absolute left-2 top-1/2 -translate-y-1/2 z-10 flex h-7 w-7 items-center justify-center rounded-full bg-black/60 text-white text-xs hover:bg-black/80"

    // ============================================================================
    // 8. DEDICATED ACCESSIBLE ZOOM MODAL ("Phóng to")
    // ============================================================================
    function ZoomModal({ isOpen, onClose, placement, platform, children, triggerRef }) {
      const closeBtnRef = useRef(null);

      useEffect(() => {
        if (!isOpen) return;
        closeBtnRef.current?.focus();

        const handleKeyDown = (e) => {
          if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            onClose();
          }
        };

        window.addEventListener("keydown", handleKeyDown, true);
        return () => {
          window.removeEventListener("keydown", handleKeyDown, true);
          triggerRef?.current?.focus();
        };
      }, [isOpen, onClose, triggerRef]);

      if (!isOpen) return null;

      const isDesktop = placement.device === "desktop";
      const dimLabel = isDesktop ? "1920 × 945 (Desktop Chrome)" : "393 × 852 (iPhone 15 / 16)";

      return (
        <div
          role="dialog"
          aria-modal="true"
          aria-label={`Phóng to ${platform.name} · ${placement.name}`}
          className="zoom-modal-backdrop fixed inset-0 z-[9999] flex flex-col p-4 sm:p-6 overflow-auto"
          style={{
            backgroundColor: "rgba(11, 11, 15, 0.9)",
            backdropFilter: "blur(8px)",
            WebkitBackdropFilter: "blur(8px)"
          }}
          onClick={(e) => {
            if (e.target === e.currentTarget) onClose();
          }}
        >
          <div className="zoom-modal-header mx-auto flex w-full max-w-[1200px] items-center justify-between pb-4 text-white">
            <div className="zoom-modal-meta flex items-center gap-2 text-sm font-semibold">
              <strong className="font-bold text-white">{platform.name}</strong>
              <span className="opacity-70"> · </span>
              <span className="opacity-90">{placement.name}</span>
              <span className="zoom-modal-ratio rounded-full bg-white/10 px-2.5 py-0.5 font-mono text-[11px] text-white/80">
                {dimLabel}
              </span>
            </div>
            <button
              ref={closeBtnRef}
              type="button"
              aria-label="Đóng"
              title="Đóng (Esc)"
              onClick={onClose}
              className="close-zoom-btn text-button inline-flex h-9 w-9 items-center justify-center rounded-full border border-white/20 bg-white/10 text-base font-bold text-white transition hover:bg-white/20 hover:scale-105"
            >
              ✕
            </button>
          </div>
          <div
            className="zoom-modal-body flex flex-1 items-center justify-center min-h-0 w-full"
            onClick={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div className="zoom-modal-content relative max-h-[88vh] max-w-[96vw] flex items-center justify-center">
              {children}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================

    function PolicyProgressBar({ value, safeLimit, maxLimit, weighted = false }) {
      const len = weighted ? countGoogleCharacters(value) : (value || "").length;
      const effMax = Math.max(1, maxLimit || 100);
      const effSafe = Math.min(effMax, safeLimit || effMax);
      const pct = Math.min(100, Math.round((len / effMax) * 100));
      const safeMarkerPct = Math.round((effSafe / effMax) * 100);
      const isOverMax = len > effMax;
      const isOverSafe = !isOverMax && len > effSafe;

                          >
                            English
                          </button>
                        </div>

                        {/* Interactive Tools */}
                        <div className="flex flex-wrap items-center gap-1.5">
                          {/* TikTok TopView Phase Toggle */}
                          {(activePlacementId === "tt_topview" || activePlacementId === "tiktok.topview" || currentPlacement.id === "tt_topview" || currentPlacement.canonicalId === "tiktok.topview") && (
                            <div
                              role="group"
                              aria-label="Giai đoạn hiển thị TopView"
                              className="inline-flex h-7.5 items-center gap-0.5 rounded-lg border border-[#E5E7EB] bg-[#F8FAFC] p-0.5"
                            >
                              <button
                                type="button"
                                onClick={() => setTiktokLatePhase(false)}
                                className={`h-full rounded-md px-2.5 text-xs font-semibold transition-colors ${
                                  !tiktokLatePhase ? "bg-[#18181B] active text-white" : "text-[#64748B] hover:text-[#18181B]"
                                }`}
                              >
                                0-3 giây đầu
                              </button>
                              <button
                                type="button"
                                onClick={() => setTiktokLatePhase(true)}
                                className={`h-full rounded-md px-2.5 text-xs font-semibold transition-colors ${
                                  tiktokLatePhase ? "bg-[#18181B] active text-white" : "text-[#64748B] hover:text-[#18181B]"
                                }`}
                              >
                                Sau 3 giây
                              </button>
                            </div>
                          )}

                          {hasSafeZoneControls && (
                            <>
                              <button
                                type="button"
                                aria-pressed={showSafeZone}
                                onClick={() => setShowSafeZone((v) => !v)}
                                className={`toolbar-pill-btn inline-flex h-7.5 items-center gap-1.5 whitespace-nowrap rounded-lg border px-2.5 text-xs font-semibold transition-colors ${
                                  showSafeZone
                                    ? "border-brand border-[#18181B] bg-[#18181B] text-white active"
                                    : "border-[#E5E7EB] bg-white text-[#525260] hover:border-[#18181B] hover:text-[#18181B]"
                                }`}
                              >
                                Vùng bị che
                              </button>
                              <button
                                type="button"
                                aria-pressed={showAppUi}
                                onClick={() => setShowAppUi((v) => !v)}
                                className={`inline-flex h-7.5 items-center gap-1.5 whitespace-nowrap rounded-lg border px-2.5 text-xs font-semibold transition-colors ${
                                  showAppUi
                                    ? "border-brand border-[#18181B] bg-[#18181B] text-white active"
                                    : "border-[#E5E7EB] bg-white text-[#525260] hover:border-[#18181B] hover:text-[#18181B]"
                                }`}
                              >
                                Giao diện app
                              </button>
                            </>
                          )}

                          {!showAll && (
                            <button
                              ref={zoomBtnRef}
                              type="button"
                              aria-label="Phóng to"
                              aria-pressed={isZoomOpen}
                              onClick={() => setIsZoomOpen(true)}
                              className={`inline-flex h-7.5 items-center gap-1.5 whitespace-nowrap rounded-lg border px-2.5 text-xs font-semibold transition-colors ${
                                isZoomOpen
                                  ? "border-brand border-[#18181B] bg-[#18181B] text-white"
                                  : "border-[#E5E7EB] bg-white text-[#18181B] hover:border-[#18181B]"
                              }`}
                            >
                              Phóng to
                            </button>
                          )}

                          <button
                            type="button"
                            onClick={() => {
                              if (document.fullscreenElement) {
                                document.exitFullscreen().catch(() => {});
                              } else {
                                const target = workbenchRef.current || document.documentElement;
                                if (target.requestFullscreen) {
                                  target.requestFullscreen().catch(() => {});
                                }
                              }
                            }}
                            className="inline-flex h-7.5 items-center gap-1.5 whitespace-nowrap rounded-lg border border-[#18181B] bg-[#18181B] px-2.5 text-xs font-semibold text-white transition-colors hover:bg-[#27272E]"
                          >
                            {isFullscreen ? "Thoát toàn màn hình" : "Toàn màn hình"}
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Right Pane Body */}
                    <div className="grid gap-4 px-4 py-4 sm:px-5 sm:py-5 [&>*]:min-w-0">
                      {/* Safe Zone Legend when active */}
                      {hasSafeZoneControls && showSafeZone && (
                        <div className="flex flex-wrap items-center gap-4 text-xs text-[#64748B]">
                          <span className="inline-flex items-center gap-1.5">
                            <span className="h-3 w-3 rounded-full border border-dashed border-[#DC2626] bg-[#DC2626]/25" />
                            <span>Luôn bị giao diện che</span>
                          </span>
                          <span className="inline-flex items-center gap-1.5">
                            <span className="h-3 w-3 rounded-full border border-dashed border-amber-500 bg-amber-500/20" />
                            <span>Bị che thêm khi chú thích dài / nút CTA bung ra</span>
                          </span>
                        </div>
                      )}

                      {/* Mockup Stage Container */}
                      {showAll ? (
                        <div className="space-y-4">
                          {activePlatform === "admicro" && (
                            <div className="rounded-xl border border-[#E5E7EB] bg-white p-3">
                              <div className="mb-2 flex items-center justify-between text-[11px] font-bold tracking-tight text-[#18181B]">
                                <span>Chọn Báo hiển thị cho Tất cả 14 vị trí CPD Trang chủ</span>
                                <span className="rounded-full border border-[#E5E7EB] bg-[#F8FAFC] px-2.5 py-0.5 font-mono text-[10.5px] font-semibold text-[#18181B]">
                                  {(ADMICRO_CPD_SITES.find((s) => s.id === (state.admicroSite || "cafef")) || ADMICRO_CPD_SITES[0]).name}
                                </span>
                              </div>
                              <div className="flex flex-wrap gap-1">
                                {ADMICRO_CPD_SITES.map((s) => {
                                  const active = s.id === (state.admicroSite || "cafef");
                                  return (
                                    <button
                                      key={s.id}
                                      type="button"
                                      onClick={() => updateField("admicroSite", s.id)}
                                      className={`rounded-full border px-2.5 py-1 text-[11px] font-semibold transition-colors ${
                                        active
                                          ? "border-[#18181B] bg-[#18181B] text-white"
                                          : "border-[#E5E7EB] bg-[#F8FAFC] text-[#525260] hover:bg-white hover:text-[#18181B]"
                                      }`}
                                    >
                                      {s.name}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          )}
                          <div className="grid grid-cols-1 gap-6 md:grid-cols-2">
                            {platformPlacements.map((pl) => {
                              const plVal = evaluateValidation(pl, state);
                              return (
                                <div
                                  key={pl.id}
                                  onClick={() => {
                                    setShowAll(false);
                                    setActivePlacementId(pl.id);
                                  }}
                                  className="cursor-pointer space-y-2.5"
                                >
                                  <div className="flex items-center justify-between px-1">
                                    <span className="text-sm font-bold text-[#18181B]">{pl.name}</span>
                                    <span
                                      className={`inline-flex h-6 items-center gap-1 rounded-full border px-2.5 text-[11px] font-medium ${
                                        plVal.errors.length > 0
                                          ? "border-[#FECACA] bg-[#FEF2F2] text-[#DC2626]"
                                          : "border-[#E5E7EB] bg-white text-[#525260]"
                                      }`}
                                    >
                                      <span className={`h-1.5 w-1.5 rounded-full ${plVal.errors.length > 0 ? "bg-[#DC2626]" : plVal.warnings.length > 0 ? "bg-[#F59E0B]" : "bg-[#16a34a]"}`} />
                                      <span>
                                        {plVal.errors.length > 0
                                          ? `${plVal.errors.length} lỗi`
                                          : plVal.warnings.length > 0
                                          ? `${plVal.warnings.length} lưu ý`
                                          : "Không có lỗi"}
                                      </span>
                                    </span>
                                  </div>
                                  <PlacementPreview
                                    state={state}
                                    placement={pl}
                                    showSafeZone={showSafeZone}
                                    showAppUi={showAppUi}
                                    tiktokLatePhase={tiktokLatePhase}
                                    lang={lang}
                                    isGrid={true}
                                    onUpdateField={updateField}
                                  />
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      ) : (
                        <div className="review-surface grid gap-3 rounded-xl border border-[#E5E7EB] bg-[#F8FAFC] px-3 py-5 sm:px-5 [&>*]:min-w-0">
                          <PlacementPreview
                            state={state}
                            placement={currentPlacement}
                            showSafeZone={showSafeZone}
                            showAppUi={showAppUi}
                            tiktokLatePhase={tiktokLatePhase}
                            lang={lang}
                            isGrid={false}
                            onUpdateField={updateField}
                          />
                        </div>
                      )}

                      {/* Validation & Official Specs Section (Kiểm tra vị trí này) */}
                      {!showAll && (
                        <div className="contents [&>*]:min-w-0">
                          <div className="grid gap-2">
                            <p className="flex flex-wrap items-center gap-2 text-sm font-bold text-[#18181B]">
                              <span>Kiểm tra vị trí này</span>
                              {errorCount > 0 && (
                                <span className="inline-flex h-6 items-center gap-1.5 whitespace-nowrap rounded-full border border-[#FECACA] bg-[#FEF2F2] px-2.5 text-[11px] font-semibold text-[#DC2626]">
                                  <span className="h-1.5 w-1.5 rounded-full bg-[#DC2626]" />
                                  <span>{errorCount} lỗi</span>
                                </span>
                              )}
                              {warningCount > 0 && (
                                <span className="inline-flex h-6 items-center gap-1.5 whitespace-nowrap rounded-full border border-[#E5E7EB] bg-white px-2.5 text-[11px] font-medium text-[#525260]">
                                  <span className="h-1.5 w-1.5 rounded-full bg-[#F59E0B]" />
                                  <span>{warningCount} cảnh báo</span>
                                </span>
                              )}
                              {errorCount === 0 && warningCount === 0 && (
                                <span className="inline-flex h-6 items-center gap-1.5 whitespace-nowrap rounded-full border border-[#E5E7EB] bg-white px-2.5 text-[11px] font-medium text-[#18181B]">
                                  <span className="h-1.5 w-1.5 rounded-full bg-[#16a34a]" />
                                  <span>Không có lỗi</span>
                                </span>
                              )}
                            </p>
                            <ul className="grid gap-1.5 text-[13px] leading-snug">
                              {validation.errors.map((err, i) => (
                                <li key={`err-${i}`} className="flex gap-2">
                                  <span className="shrink-0 whitespace-nowrap font-semibold text-[#DC2626]">• Lỗi:</span>
                                  <span className="text-[#18181B]">{err}</span>
                                </li>
                              ))}
                              {validation.warnings.map((warn, i) => (
                                <li key={`warn-${i}`} className="flex gap-2">
                                  <span className="shrink-0 whitespace-nowrap font-semibold text-[#475569]">• Cảnh báo:</span>
                                  <span className="text-[#18181B]">{warn}</span>
                                </li>
                              ))}
                              {validation.notes.map((note, i) => (
                                <li key={`note-${i}`} className="flex gap-2">
                                  <span className="shrink-0 whitespace-nowrap font-medium text-[#64748B]">• Lưu ý:</span>
                                  <span className="text-[#525260]">{note}</span>
                                </li>
                              ))}
                            </ul>
                          </div>

                          {/* Minimalist Official Spec Card */}
                          <div className="grid gap-2 rounded-xl border border-[#E5E7EB] bg-[#F9FAFB] px-3.5 py-3">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                              <p className="text-sm font-bold tracking-tight text-[#18181B]">
                                {currentPlatformObj.name} · {currentPlacement.name}
                              </p>
                              <span className="flex flex-wrap gap-1.5">
                                <span className="inline-flex h-6 items-center whitespace-nowrap rounded-full border border-[#E5E7EB] bg-white px-2.5 text-[11px] font-semibold text-[#18181B]">
                                  Nên dùng {currentPlacement.ratio} ({currentPlacement.recommendedPx})
                                </span>
                                <span className="inline-flex h-6 items-center whitespace-nowrap rounded-full border border-[#E5E7EB] bg-white px-2.5 text-[11px] font-medium text-[#64748B]">
                                  {currentPlacement.sourceStatus}
                                </span>
                              </span>
                            </div>
                            <ul className="grid gap-1.5 text-[13px] leading-relaxed text-[#525260]">
                              {currentPlacement.specs.map((sp, i) => (
                                <li key={i} className="flex gap-2">
                                  <span className="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-[#94A3B8]" />
                                  <span>{sp}</span>
                                </li>
                              ))}
                            </ul>
                            <details className="text-xs text-[#64748B]">
                              <summary className="cursor-pointer font-semibold text-[#18181B] hover:underline">
                                Nguồn thông số ({currentPlacement.sourceCount || 2})
                              </summary>
                              <p className="mt-1 text-[11px]">
                                Tài liệu hướng dẫn kích thước & thông số kỹ thuật quảng cáo chính thức của {currentPlatformObj.name}.
                              </p>
                            </details>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </div>

          {/* Dedicated Accessible Zoom Modal */}
          <ZoomModal
            isOpen={isZoomOpen}
            onClose={() => setIsZoomOpen(false)}
            placement={currentPlacement}
            platform={currentPlatformObj}
            triggerRef={zoomBtnRef}
          >
            <PlacementPreview
              state={state}
              placement={currentPlacement}
              showSafeZone={showSafeZone}
              showAppUi={showAppUi}
              tiktokLatePhase={tiktokLatePhase}
              lang={lang}
              isGrid={false}
              isZoomed={true}
              onUpdateField={updateField}
            />
          </ZoomModal>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<AdPreviewWorkspace />);
  </script>
</body>
</html>
